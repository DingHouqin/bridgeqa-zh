[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgeqa-zh"
version = "0.1.0"
description = "Chinese and mixed-language adversarial multi-hop QA benchmark scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
schema = ["jsonschema>=4,<5"]

[dependency-groups]
dev = ["jsonschema==4.26.0"]

[project.scripts]
bridgeqa = "bridgeqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
